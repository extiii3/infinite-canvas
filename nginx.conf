server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Origin guard: only requests carrying the secret header set by Cloudflare are served.
    # ORIGIN_SECRET is substituted at container start (nginx templates/envsubst).
    if ($http_x_origin_auth != "${ORIGIN_SECRET}") {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebDAV sync storage (webdav server on 127.0.0.1:6065, data on volume /data).
    location /dav {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:6065;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
