server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Origin guard: every location except /healthz requires the secret header set by Cloudflare.
    # ORIGIN_SECRET is substituted at container start (nginx templates/envsubst).

    # Unguarded health check for Railway.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        # Railway health checker hits / without the Cloudflare header; answer it with a bare 200.
        if ($http_user_agent ~ "^RailwayHealthCheck") { return 200 "ok"; }
        if ($http_x_origin_auth != "${ORIGIN_SECRET}") { return 403; }
        try_files $uri $uri/ /index.html;
    }

    # Server-side AI upstreams with injected API keys (generated at start by 45-upstreams.sh).
    include /etc/nginx/upstreams/*.conf;
    location /upstream/ { return 404; }

    # WebDAV sync storage (webdav server on 127.0.0.1:6065, data on volume /data).
    location /dav {
        if ($http_x_origin_auth != "${ORIGIN_SECRET}") { return 403; }
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:6065;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        if ($http_x_origin_auth != "${ORIGIN_SECRET}") { return 403; }
        add_header Cache-Control "no-store";
    }
}
